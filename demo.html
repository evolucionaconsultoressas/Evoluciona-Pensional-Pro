<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba tu demo de 24 horas | Evoluciona Pensional PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#F6F3EC; --bg-panel:#FFFFFF; --ink:#22261F; --ink-soft:#5B5F53;
    --green-deep:#1C3A2B; --green-mid:#2C5741; --gold:#A8823A; --gold-soft:#EADFC4;
    --line:#DAD4C3; --rojo:#AE4B33; --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ background:var(--green-deep); color:var(--ink); font-family:'Public Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--bg-panel); border-radius:var(--radius); box-shadow:0 8px 30px rgba(0,0,0,0.25); padding:40px; width:100%; max-width:440px; }
  .brand{ font-family:'Fraunces',serif; font-size:19px; color:var(--green-deep); font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .pro-badge{ font-size:10px; background:var(--green-deep); color:#F6F3EC; padding:2px 7px; border-radius:3px; letter-spacing:.04em; }
  h1{ font-family:'Fraunces',serif; font-size:22px; color:var(--green-deep); margin:14px 0 6px; }
  .subtitle{ font-size:13.5px; color:var(--ink-soft); margin:0 0 24px; }
  label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:6px; }
  input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius); font-size:14.5px; margin-bottom:16px; font-family:'Public Sans',sans-serif; }
  input:focus{ outline:2px solid var(--green-deep); outline-offset:1px; }
  .hint{ font-size:12px; color:var(--ink-soft); margin:-10px 0 16px; display:block; }
  button{ width:100%; background:var(--green-deep); color:#F6F3EC; border:none; padding:13px; border-radius:var(--radius); font-size:15px; font-weight:700; cursor:pointer; }
  button:hover{ background:var(--green-mid); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ font-size:13px; margin-top:16px; padding:12px 14px; border-radius:var(--radius); display:none; }
  .msg.error{ background:#F8E9E4; color:#5E2E1E; display:block; }
  .msg.success{ background:#E4F0EA; color:#1F4433; display:block; }
  .back-link{ display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--ink-soft); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Evoluciona Pensional <span class="pro-badge">PRO</span></div>
    <h1>Prueba 24 horas gratis</h1>
    <p class="subtitle">Acceso completo a las 8 herramientas por 24 horas. Un demo por persona.</p>

    <form id="demoForm">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required>

      <label for="cedula">Cédula</label>
      <input type="text" id="cedula" required>
      <span class="hint">Solo para verificar que eres una persona real — no se comparte ni se usa para nada más.</span>

      <label for="whatsapp">WhatsApp</label>
      <input type="tel" id="whatsapp" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required>

      <label for="password">Crea una contraseña</label>
      <input type="password" id="password" required minlength="6">

      <button type="submit" id="btnDemo">Activar mi demo de 24 horas</button>
    </form>

    <div class="msg" id="msgBox"></div>
    <a class="back-link" href="index.html">← Volver al inicio</a>
  </div>

<script>
  const SUPABASE_URL = "https://mdhdlnfhnqvjelecerla.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_8CdFdPL3mCYzRfALVDO96A_J5mYv9uh";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text, type){
    const box = document.getElementById("msgBox");
    box.textContent = text;
    box.className = "msg " + type;
  }

  document.getElementById("demoForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const btn = document.getElementById("btnDemo");
    btn.disabled = true;
    btn.textContent = "Activando...";

    const nombre = document.getElementById("nombre").value.trim();
    const cedula = document.getElementById("cedula").value.trim();
    const whatsapp = document.getElementById("whatsapp").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Paso 1: crear la cuenta
    const { data: signUpData, error: signUpError } = await sb.auth.signUp({ email, password });

    if(signUpError){
      if(signUpError.message && signUpError.message.toLowerCase().includes("already registered")){
        showMsg("Ese correo ya tiene una cuenta. Si ya usaste tu demo, no se puede repetir. Si crees que es un error, escríbenos.", "error");
      } else {
        showMsg("No se pudo crear la cuenta: " + signUpError.message, "error");
      }
      btn.disabled = false;
      btn.textContent = "Activar mi demo de 24 horas";
      return;
    }

    // Paso 2: pedir el demo (revisa correo, WhatsApp y cédula contra demos anteriores)
    const { error: demoError } = await sb.rpc("solicitar_demo", {
      mi_nombre: nombre,
      mi_whatsapp: whatsapp,
      mi_cedula: cedula
    });

    if(demoError){
      if(demoError.message && demoError.message.includes("DEMO_YA_USADO")){
        showMsg("Ya se solicitó un demo antes con estos datos (correo, WhatsApp o cédula). Solo se permite un demo por persona.", "error");
      } else {
        showMsg("No se pudo activar el demo. Intenta de nuevo o escríbenos.", "error");
      }
      await sb.auth.signOut();
      btn.disabled = false;
      btn.textContent = "Activar mi demo de 24 horas";
      return;
    }

    await sb.auth.signOut(); // para que inicie sesión "limpio" por el flujo normal de login
    showMsg("¡Demo activado! Ya puedes ingresar con tu correo y contraseña — tienes 24 horas de acceso.", "success");
    setTimeout(()=>{ window.location.href = "login.html"; }, 2500);
  });
</script>
</body>
</html>
